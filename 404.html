<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Alex Matias</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/tema.js"></script>
</head>
<body>
  <main class="erro-404">
    <p class="secao-cmd mono"><span class="sinal">$</span> git checkout <span id="caminho">esta-pagina</span></p>
    <h1>404</h1>
    <pre class="erro-saida mono">error: pathspec '<span id="caminho-2">esta-pagina</span>' did not match any file(s) known to git</pre>
    <p class="secao-sub">Essa página não existe, ou mudou de lugar.</p>
    <a class="btn btn-primario" href="/">git checkout main</a>
  </main>
  <script>
    // Mostra o caminho que o visitante tentou abrir (só como texto)
    (function () {
      var c = decodeURIComponent(location.pathname.replace(/^\/+/, "")) || "esta-pagina";
      document.getElementById("caminho").textContent = c;
      document.getElementById("caminho-2").textContent = c;
    })();
  </script>
</body>
</html>
