<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Page not found · Alex Matias</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <!-- Fontes no próprio site (sem esperar o Google Fonts): pré-carregadas para o texto aparecer logo -->
  <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/tema.js"></script>
  <script async src="/js/analytics.js"></script>
</head>
<body>
  <main class="erro-404">
    <p class="secao-cmd mono"><span class="sinal">$</span> git checkout <span id="caminho">esta-pagina</span></p>
    <h1>404</h1>
    <pre class="erro-saida mono">error: pathspec '<span id="caminho-2">esta-pagina</span>' did not match any file(s) known to git</pre>
    <p class="secao-sub">Essa página não existe, ou mudou de lugar.</p>
    <p class="secao-sub" lang="en">This page doesn't exist, or it has moved.</p>
    <p class="erro-acoes"><a class="btn btn-primario" href="/">git checkout main</a> <a class="btn btn-secundario" href="/en" hreflang="en" lang="en">English version</a></p>
  </main>
  <script>
    // Mostra o caminho que o visitante tentou abrir (só como texto)
    (function () {
      var c = decodeURIComponent(location.pathname.replace(/^\/+/, "")) || "esta-pagina";
      document.getElementById("caminho").textContent = c;
      document.getElementById("caminho-2").textContent = c;
    })();
  </script>
</body>
</html>
