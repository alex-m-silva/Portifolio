<!doctype html>
<!--
  Modelo dos ícones do app (manifest, apple-touch-icon, favicon.ico).
  ?tam=512 define o tamanho; ?maskable=1 deixa margem de segurança para ícones adaptativos.
  Para regerar, veja tools/README.md.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>icone</title>
<style>
  * { margin: 0; }
  html, body { overflow: hidden; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var tam = parseInt(q.get("tam"), 10) || 512;
  var maskable = q.get("maskable") === "1";
  // No maskable o desenho ocupa só a zona segura central (~80%) e o fundo vai até a borda
  var escala = maskable ? 0.72 : 1;
  var raio = maskable ? 0 : 14;
  var d = (64 - 64 * escala) / 2;
  document.body.innerHTML =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + tam + '" height="' + tam + '" viewBox="0 0 64 64">' +
    '<rect width="64" height="64" rx="' + raio + '" fill="#0b0f14"/>' +
    '<g transform="translate(' + d + ' ' + d + ') scale(' + escala + ')">' +
    '<path d="M22 14v36M22 40c0-10 20-8 20-18" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round"/>' +
    '<circle cx="22" cy="14" r="6" fill="#3ddc97"/>' +
    '<circle cx="22" cy="50" r="6" fill="#0b0f14" stroke="#3ddc97" stroke-width="4"/>' +
    '<circle cx="42" cy="20" r="6" fill="#5cc8ff"/>' +
    '</g></svg>';
</script>
</body>
</html>
